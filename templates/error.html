{% extends "layout.html" %}

{% block title %}Error {{ error.code }} - Sistema de Emergencias{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full text-center bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        
        <!-- Código de Error -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-red-100 text-red-600 mb-6">
            <span class="text-3xl font-extrabold">{{ error.code }}</span>
        </div>

        <!-- Mensaje Principal -->
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-2">
            {{ error.message }}
        </h1>

        <!-- Descripción Detallada -->
        <p class="text-slate-600 text-sm leading-relaxed mb-8">
            {{ error.description }}
        </p>

        <!-- Botón de Acción -->
        <div class="flex justify-center gap-4">
            <a href="/" 
               class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition">
                Volver al inicio
            </a>
        </div>

    </div>
</div>
{% endblock %}
